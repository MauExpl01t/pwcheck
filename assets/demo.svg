  <text x="20" y="56" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#27c93f" xml:space="preserve">$ pwcheck audit passwords_demo.txt</text>
<text x="20" y="75" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#ffbd2e" xml:space="preserve">AVISO: revisa solo contraseñas tuyas o que tengas autorización legítima para poseer (p. ej. obtenidas en un</text>
<text x="20" y="94" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    pentest autorizado). La contraseña nunca se envía completa por la red (k-anonimato) ni queda guardada</text>
<text x="20" y="113" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    por esta herramienta.</text>
<text x="20" y="132" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#58a6ff" xml:space="preserve">Revisadas    : 3</text>
<text x="20" y="151" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#58a6ff" xml:space="preserve">Filtradas    : 2</text>
<text x="20" y="170" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#58a6ff" xml:space="preserve">Con observ.  : 2</text>
<text x="20" y="189" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve"></text>
<text x="20" y="208" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#ff5f56" xml:space="preserve">[FILTRADA (210,461,208 veces)] admin</text>
<text x="20" y="227" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    - Longitud 6 caracteres, se recomiendan al menos 12.</text>
<text x="20" y="246" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    - Usa menos de 3 tipos de carácter (minúscula/mayúscula/dígito/símbolo).</text>
<text x="20" y="265" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    - Es una de las contraseñas más comunes del mundo.</text>
<text x="20" y="284" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#27c93f" xml:space="preserve">[sin filtración conocida] usuario1</text>
<text x="20" y="303" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#ff5f56" xml:space="preserve">[FILTRADA (13,871,714 veces)] soporte</text>
<text x="20" y="322" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    - Longitud 9 caracteres, se recomiendan al menos 12.</text>
<text x="20" y="341" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    - Usa menos de 3 tipos de carácter (minúscula/mayúscula/dígito/símbolo).</text>
<text x="20" y="360" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="13" fill="#c9d1d9" xml:space="preserve">    - Es una de las contraseñas más comunes del mundo.</text>

